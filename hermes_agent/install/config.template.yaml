# jobhermes-managed - overwritten by hermes_agent/install/install.sh unless edited
model:
  default: mst/free
  provider: msrouter
providers:
  msrouter:
    api: http://127.0.0.1:8787/v1
    api_key: msrouter-local
    transport: chat_completions
    default_model: mst/free
  tokenrouter:
    api: https://api.tokenrouter.com/v1
    api_key: REPLACE_WITH_TOKENROUTER_KEY  # real key lives in ~/.hermes/config.yaml (gitignored)
    transport: chat_completions
    default_model: z-ai/glm-5.3-free
    models:
      - z-ai/glm-5.3-free
  laptop:
    api: https://laptop-a64sv2el.taila0a683.ts.net/v1
    api_key: laptop
    transport: chat_completions
    default_model: qwen3.5:0.8b
    models:
      - qwen3.5:0.8b
agent:
  max_turns: 200
plugins:
  enabled:
    - jobapps
quick_commands:
  campaign-status:
    type: exec
    command: bash /Users/mst/Downloads/job-search/job-apply/tick_status.sh 2>&1 | head -40
  last-tick:
    type: exec
    command: cat /Users/mst/ZCodeProject/openclaw-job-search/hermes_agent/state/tick-context.md 2>/dev/null || echo "no tick recorded yet"
  prompt-preview:
    type: exec
    command: cd /Users/mst/ZCodeProject/openclaw-job-search/hermes_agent && PYTHONPATH=src .venv/bin/python -m jobhermes --once --dry-run 2>/dev/null | head -60
mcp_servers:
  playwright:
    command: /opt/homebrew/opt/node@24/bin/node
    args:
      - /Users/mst/.local/share/openclaw-tools/node_modules/@playwright/mcp/cli.js
      - --cdp-endpoint
      - http://127.0.0.1:9222
      - --cdp-timeout
      - "120000"
      - --output-dir
      - /Users/mst/ZCodeProject/openclaw-job-search/playwright-output
      - --output-mode
      - file
      - --save-session
      - --codegen
      - none
  rag:
    command: /Users/mst/ZCodeProject/openclaw-job-search/rag/.venv/bin/python
    args:
      - /Users/mst/ZCodeProject/openclaw-job-search/rag/rag_server.py
