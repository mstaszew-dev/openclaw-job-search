# msrouter moves out of lubuntu-agent onto its own pod: the LLM gateway keys
# leave the host home dir with the browser profile no longer sharing a
# filesystem with them. Image built on the lubuntu host from the msrouter
# k3s-headless clone (dist + node_modules are already committed there), see
# deploy/docker/Dockerfile.msrouter.
#
# MSROUTER_HEADLESS=1 (k3s-headless branch, 459184f) skips the iTerm2 startup
# guard and spawns the campaign worker and Kafka headlessly instead of tabs.
# The Director is OFF: this pod is only the gateway. The campaign Kafka lives
# in kafka.campaign.svc, not in the director's environment.
#
# PAUSED (operator, 2026-10-08): replicas 0. Every CV score the finder asks for
# costs gateway tokens and shadow mode needs no scored decisions, so the pod
# stays down. FINDER_SCORING_ENABLED=false in finder.yaml is the matching
# switch: the finder still collects and produces, it just skips the chat call.
# To resume: set replicas back to 1 here, set FINDER_SCORING_ENABLED=true in
# finder.yaml, then rollout restart both deployments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: msrouter
  namespace: campaign
spec:
  replicas: 0
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never lose the gateway during restart
  selector:
    matchLabels: { app: msrouter }
  template:
    metadata:
      labels: { app: msrouter }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: msrouter
          image: localhost:5000/msrouter:k3s-headless-v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: campaign-msrouter   # provider keys, built with --from-env-file
          env:
            - name: PORT
              value: "3000"
            - name: MSROUTER_HEADLESS
              value: "1"
            - name: DIRECTOR_INTERVAL_MINUTES
              value: "-1"                  # director observe-loop disabled
            - name: DIRECTOR_AUTOSTART
              value: "false"
            - name: KAFKA_ENABLED
              value: "false"
            - name: VPN_ROTATION_INTERVAL_MINUTES
              value: "0"
            - name: LAPTOP_ENABLED
              value: "false"
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits: { memory: 512Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: msrouter
  namespace: campaign
spec:
  type: ClusterIP
  selector: { app: msrouter }
  ports:
    - { port: 3000, targetPort: 3000 }
