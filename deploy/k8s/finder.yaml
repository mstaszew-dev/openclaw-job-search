# finder: discovery + dedup + scoring, then PRODUCE to campaign.jobs (keyed by
# companyKey). JVM image; native is deferred (Spring Data Mongo is a poor
# native-image citizen and the 7GB host cannot spare the build).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finder
  namespace: campaign
spec:
  replicas: 1
  selector:
    matchLabels: { app: finder }
  template:
    metadata:
      labels: { app: finder }
    spec:
      containers:
        - name: finder
          image: localhost:5000/campaign-finder:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: campaign-mongo, key: password } }
            - name: MONGO_URI
              value: mongodb://campaign:$(MONGO_PASSWORD)@mongo.campaign.svc.cluster.local:27017/campaign?authSource=admin
            # sent as the bearer token to the gateway when the msrouter env
            # file sets GATEWAY_TOKEN (bootstrap copies it to gateway-token);
            # absent otherwise, so in-cluster calls 401 by surprise never happen
            - name: MSROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: campaign-msrouter, key: gateway-token, optional: true }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.campaign.svc.cluster.local:9092
            - name: MSROUTER_URL
              value: http://msrouter.campaign.svc.cluster.local:3000/v1
            # Gateway is paused (msrouter replicas 0 in msrouter.yaml): collect
            # and produce as usual, but score with the fallback and spend nothing.
            - name: FINDER_SCORING_ENABLED
              value: "false"
            - name: FINDER_MCP_COMMAND
              value: node /opt/playwright-mcp/cli.js --cdp-endpoint http://192.168.18.13:30922
            - name: FINDER_RUN_INTERVAL_SECONDS
              value: "900"
          ports: [{ containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            # 60% heap + JVM non-heap + the MCP node child inside one cgroup
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 768Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: finder
  namespace: campaign
spec:
  selector: { app: finder }
  ports: [{ port: 8081, targetPort: 8081 }]
