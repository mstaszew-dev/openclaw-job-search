# apply-worker: ONE replica (shares the single logged-in Chrome via CDP).
# APPLY_MODE=shadow is the safe default; cutover flips it to live.
#
# Kafka owns delivery: consumes campaign.jobs, commits the offset only after
# the Mongo write. job_state is bookkeeping, never a queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apply-worker
  namespace: campaign
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }   # never two workers
  selector:
    matchLabels: { app: apply-worker }
  template:
    metadata:
      labels: { app: apply-worker }
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: localhost:5000/campaign-worker:v5
          imagePullPolicy: IfNotPresent
          env:
            # authSource=admin: the user is the image entrypoint's root user,
            # not a per-database one, and Mongo heads it there by default only
            # in the shell, not in a driver URI.
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: campaign-mongo, key: password } }
            - name: MONGO_URI
              value: mongodb://campaign:$(MONGO_PASSWORD)@mongo.campaign.svc.cluster.local:27017/campaign?authSource=admin
            # sent as the bearer token to the gateway when the msrouter env
            # file sets GATEWAY_TOKEN (bootstrap copies it to gateway-token);
            # absent otherwise, so in-cluster calls 401 by surprise never happen
            - name: MSROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: campaign-msrouter, key: gateway-token, optional: true }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.campaign.svc.cluster.local:9092
            - name: APPLY_MODE
              # shadow | live. LIVE since the 2026-10-20 cutover: applies drive
              # the shared Chrome for real. Rollback = "shadow" + restart; the
              # gateway must stay up while live (see msrouter.yaml).
              value: "live"
            - name: MSROUTER_URL
              value: http://msrouter.campaign.svc.cluster.local:3000/v1
            # Model alias used by the worker when calling msrouter. mst/free
            # walks the full pool: ZAI glm-4.7-flash first (prioritized at
            # front of the routing queue), then OpenRouter and the rest as
            # fallbacks when ZAI rate-limits.
            - name: MSROUTER_MODEL
              value: "mst/free"
            - name: APPLICANT_PROFILE_TEXT
              value: "IDENTITY (use EXACTLY these values on every application form; never invent, guess, or vary any of them): - Name: Michał Staszewski (Michael Staszewski) - Email: mst.rocking@gmail.com - the ONLY email you may ever type into a form field - Phone (PL): +48790775407 - Phone (IL): +972559344507 - Location: Biała Parcela, województwo łódzkie, Polska - City: Biała Parcela, Poland - LinkedIn: https://www.linkedin.com/in/micha%C5%82-staszewski-220315179 - GitHub: https://github.com/mstaszew-dev - Salary expectation (PL B2B): 15000 PLN net+VAT/month - CV (PL): /app/cv/michael-staszewski-cv-pl.pdf - Cover note (PL): Senior backend/full-stack (Java/Kotlin/Spring, PHP/Laravel, Node/React), 14+ lat doświadczenia. - PL B2B note: Mam firmę zarejestrowaną w Polsce i mogę pracować w pełni zdalnie na B2B."
            - name: WORKER_MCP_COMMAND
              # --config /app/pw-mcp.json raises action 5000->30000ms and
              # expect 5000->15000ms (no --timeout-expect flag exists; the
              # file is written inline in deploy/docker/Dockerfile.jvm).
              value: node /opt/playwright-mcp/cli.js --cdp-endpoint http://100.94.153.31:30922 --config /app/pw-mcp.json
            # V8 heap cap for the per-job node MCP process: exit=134 aborts
            # (german-pracuj 2026-10-27) happen when node's default old-space
            # exceeds the container budget mid-grind; capping below the pod
            # limit makes V8 GC harder instead of aborting.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            # Canonical PL CV inside the container (hostPath mount below). The
            # model never sees this path: upload_cv owns it (cv_upload.py port).
            # MUST stay under /app: playwright-mcp only accepts file paths
            # inside its allowed roots (cwd /app + /app/.playwright-mcp), and
            # DOM.setFileInputFiles resolves the SAME string in Chrome's pod,
            # where lubuntu-agent mounts the same hostPath at /app/cv.
            - name: CV_PATH_PL
              value: /app/cv/michael-staszewski-cv-pl.pdf
            # Same Chrome the Playwright MCP drives; used only by upload_cv's
            # CDP fallback (DOM.setFileInputFiles) for drop zones that never
            # open a native chooser.
            - name: WORKER_CDP_URL
              value: http://100.94.153.31:30922
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Slack outcome posts to #jobcampaign (SlackNotifier). Same creds
            # msrouter's director surface uses; optional: absent keys mean the
            # notifier stays silent, the apply pipeline never blocks on Slack.
            - name: SLACK_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_BOT_TOKEN, optional: true } }
            - name: SLACK_CHANNEL
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_CHANNEL, optional: true } }
            - name: SLACK_WEBHOOK
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_WEBHOOK, optional: true } }
            # Step cap for the browser tool loop (AgentLoopBounds derives the
            # Kafka poll budget from the same env). 150 (was 120): the SSO
            # login step added to portal applies plus external-ATS forms
            # pushed one unit (bold-pl 2026-10-26) to a 120-step cap-out on
            # an ACTING grind. 150 = 8.75h bounded worst case.
            - name: WORKER_MAX_STEPS
              value: "150"
            - name: CAMPAIGN_API_URL
              value: http://campaign-api.campaign.svc.cluster.local:8080
          ports: [{ containerPort: 8082 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests: { memory: 768Mi, cpu: 250m }
            limits: { memory: 1536Mi, cpu: "1" }
          volumeMounts:
            # Read-only: the worker must never write next to the canonical CV.
            # /app/cv (not /cv): the path must sit inside playwright-mcp's
            # allowed root (/app) AND resolve identically in Chrome's pod.
            - name: cv
              mountPath: /app/cv
              readOnly: true
      volumes:
        - name: cv
          hostPath:
            path: /home/mstro/k3s-pod-data/agent-home/cv
            type: Directory
