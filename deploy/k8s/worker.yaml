# apply-worker: ONE replica (shares the single logged-in Chrome via CDP).
# APPLY_MODE=shadow is the safe default; cutover flips it to live.
#
# Kafka owns delivery: consumes campaign.jobs, commits the offset only after
# the Mongo write. job_state is bookkeeping, never a queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apply-worker
  namespace: campaign
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }   # never two workers
  selector:
    matchLabels: { app: apply-worker }
  template:
    metadata:
      labels: { app: apply-worker }
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: localhost:5000/campaign-worker:v1
          imagePullPolicy: IfNotPresent
          env:
            # authSource=admin: the user is the image entrypoint's root user,
            # not a per-database one, and Mongo heads it there by default only
            # in the shell, not in a driver URI.
            - name: MONGO_PASSWORD
              valueFrom: { secretKeyRef: { name: campaign-mongo, key: password } }
            - name: MONGO_URI
              value: mongodb://campaign:$(MONGO_PASSWORD)@mongo.campaign.svc.cluster.local:27017/campaign?authSource=admin
            # sent as the bearer token to the gateway when the msrouter env
            # file sets GATEWAY_TOKEN (bootstrap copies it to gateway-token);
            # absent otherwise, so in-cluster calls 401 by surprise never happen
            - name: MSROUTER_API_KEY
              valueFrom:
                secretKeyRef: { name: campaign-msrouter, key: gateway-token, optional: true }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.campaign.svc.cluster.local:9092
            - name: APPLY_MODE
              # shadow | live. LIVE since the 2026-10-20 cutover: applies drive
              # the shared Chrome for real. Rollback = "shadow" + restart; the
              # gateway must stay up while live (see msrouter.yaml).
              value: "live"
            - name: MSROUTER_URL
              value: http://msrouter.campaign.svc.cluster.local:3000/v1
            - name: WORKER_MCP_COMMAND
              value: node /opt/playwright-mcp/cli.js --cdp-endpoint http://192.168.18.13:30922
            # Canonical PL CV inside the container (hostPath mount below). The
            # model never sees this path: upload_cv owns it (cv_upload.py port).
            - name: CV_PATH_PL
              value: /cv/michael-staszewski-cv-pl.pdf
            # Same Chrome the Playwright MCP drives; used only by upload_cv's
            # CDP fallback (DOM.setFileInputFiles) for drop zones that never
            # open a native chooser.
            - name: WORKER_CDP_URL
              value: http://192.168.18.13:30922
            - name: WORKER_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Slack outcome posts to #jobcampaign (SlackNotifier). Same creds
            # msrouter's director surface uses; optional: absent keys mean the
            # notifier stays silent, the apply pipeline never blocks on Slack.
            - name: SLACK_BOT_TOKEN
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_BOT_TOKEN, optional: true } }
            - name: SLACK_CHANNEL
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_CHANNEL, optional: true } }
            - name: SLACK_WEBHOOK
              valueFrom: { secretKeyRef: { name: campaign-msrouter, key: SLACK_WEBHOOK, optional: true } }
            # Step cap for the browser tool loop (AgentLoopBounds derives the
            # Kafka poll budget from the same env). 60 = 3.5h bounded worst case.
            - name: WORKER_MAX_STEPS
              value: "60"
          ports: [{ containerPort: 8082 }]
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests: { memory: 768Mi, cpu: 250m }
            limits: { memory: 1536Mi, cpu: "1" }
          volumeMounts:
            # Read-only: the worker must never write next to the canonical CV.
            - name: cv
              mountPath: /cv
              readOnly: true
      volumes:
        - name: cv
          hostPath:
            path: /home/mstro/k3s-pod-data/agent-home/cv
            type: Directory
