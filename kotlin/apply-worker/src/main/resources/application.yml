spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://127.0.0.1:27017/campaign?directConnection=true}
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      fail-fast: false
    producer:
      # A send that cannot reach the broker within this window is a warning,
      # not a stack trace: the finder keeps collecting either way.
      delivery.timeout.ms: 30000
      request.timeout.ms: 10000
  application:
    name: apply-worker
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${PORT:8082}
  shutdown: graceful

worker:
  apply-mode: ${APPLY_MODE:shadow}   # shadow | live
  # Attempts before campaign.jobs.dlq. Tracked in job_state so the bound
  # survives a worker restart.
  max-attempts: ${WORKER_MAX_ATTEMPTS:3}
  worker-id: ${WORKER_ID:worker-1}
  msrouter-url: ${MSROUTER_URL:http://127.0.0.1:8787/v1}
  msrouter-api-key: ${MSROUTER_API_KEY:}
  msrouter-model: ${MSROUTER_MODEL:glm-4.7-flash}
  # CDP endpoint of the shared campaign Chrome (CV upload fallback only).
  cdp-url: ${WORKER_CDP_URL:http://127.0.0.1:9222}
  # Mutual exclusion on the shared Chrome. The worker waits for a busy
  # browser (a discovery pass) instead of failing the job outright; past the
  # wait budget the job is deferred for redelivery, which still costs one
  # attempt, so the budget is deliberately generous.
  lease-ttl-minutes: ${WORKER_LEASE_TTL_MINUTES:25}
  lease-wait-seconds: ${WORKER_LEASE_WAIT_SECONDS:600}
  lease-renew-seconds: ${WORKER_LEASE_RENEW_SECONDS:300}
  # Hourly campaign digest to #jobcampaign (SlackStatsReporter). The first
  # post lands 45s after startup, so every deploy proves the Slack wiring
  # with a fresh count right away.
  stats-report-interval-seconds: ${WORKER_STATS_REPORT_INTERVAL_SECONDS:3600}

chrome:
  lease:
    # Kill switch for the shared-browser lease (see ChromeLease). False hands
    # out no-op handles: use only when the lease mechanism itself misbehaves.
    enabled: ${CHROME_LEASE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
