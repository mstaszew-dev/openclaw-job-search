spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://127.0.0.1:27017/campaign?directConnection=true}
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    admin:
      fail-fast: false
    producer:
      # A send that cannot reach the broker within this window is a warning,
      # not a stack trace: the finder keeps collecting either way.
      delivery.timeout.ms: 30000
      request.timeout.ms: 10000
  application:
    name: apply-worker
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${PORT:8082}
  shutdown: graceful

worker:
  apply-mode: ${APPLY_MODE:shadow}   # shadow | live
  # Attempts before campaign.jobs.dlq. Tracked in job_state so the bound
  # survives a worker restart.
  max-attempts: ${WORKER_MAX_ATTEMPTS:3}
  worker-id: ${WORKER_ID:worker-1}
  msrouter-url: ${MSROUTER_URL:http://127.0.0.1:8787/v1}
  msrouter-api-key: ${MSROUTER_API_KEY:}
  msrouter-model: ${MSROUTER_MODEL:mst/free}

management:
  endpoints:
    web:
      exposure:
        include: health,info
