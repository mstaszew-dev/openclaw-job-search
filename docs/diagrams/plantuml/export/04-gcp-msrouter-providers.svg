h:0.5;"/><text x="2050" y="503.023" fill="#000" font-size="14" textLength="233.946">EXTRA_PROVIDER_ORDER 6 - cline</text></g><!--entity n8--><g class="entity" data-qualified-name="n8" id="ent0009" data-source-line="12"><rect x="2327" y="469.488" width="347.651" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="2654.651" y="474.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2652.651" y="476.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2652.651" y="480.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="2342" y="503.023" fill="#000" font-size="14" textLength="307.651">EXTRA_PROVIDER_ORDER 7 (last) - cloudflare</text></g><!--entity n9--><g class="entity" data-qualified-name="n9" id="ent0010" data-source-line="13"><rect x="2693" y="469.488" width="655.973" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="3328.973" y="474.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="3326.973" y="476.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="3326.973" y="480.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="2708" y="503.023" fill="#000" font-size="14" textLength="615.973">local slot (on-host LLM providers) - tried before the extras (msrouter config, not facts.md)</text></g><!--entity n10--><g class="entity" data-qualified-name="n10" id="ent0011" data-source-line="14"><rect x="1090" y="107.988" width="606.46" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1676.46" y="112.988" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1674.46" y="114.988" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1674.46" y="118.988" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1105" y="141.523" fill="#000" font-size="14" textLength="566.46">pause switch - msrouter.yaml replicas 0 + finder FINDER_SCORING_ENABLED=false</text></g><g class="entity" data-qualified-name="guide" id="ent0023" data-source-line="27"><path d="M1714,49.488 L1714,212.594 L2182.427,212.594 L2182.427,59.488 L2172.427,49.488 L1714,49.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2172.427,49.488 L2172.427,59.488 L2182.427,59.488 L2172.427,49.488" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1720" y="67.057" fill="#000" font-size="13" textLength="266.373">GCP is the Google Gemini slot in msrouter</text><text x="1720" y="82.367" fill="#000" font-size="13" textLength="390.882">Base URL: generativelanguage.googleapis.com/v1beta/openai</text><text x="1720" y="97.678" fill="#000" font-size="13" textLength="422.868">Default model: gemini-2.5-flash-lite, free tier via GEMINI_API_KEY.</text><text x="1720" y="112.988" fill="#000" font-size="13" textLength="440.762">Order: unorouter, groq, sambanova, mistral, gemini, cline, cloudflare.</text><text x="1720" y="128.299" fill="#000" font-size="13" textLength="401.959">Cloudflare is last in the walk; the local on-host slot comes first.</text><text x="1720" y="143.609" fill="#000" font-size="13" textLength="447.427">The extras order is the facts.md EXTRA_PROVIDER_ORDER; the primary</text><text x="1720" y="158.92" fill="#000" font-size="13" textLength="360.375">and local slots come from msrouter config, not facts.md.</text><text x="1720" y="174.23" fill="#000" font-size="13" textLength="391.46">Pause switch (moves together): msrouter replicas 0 and finder</text><text x="1720" y="189.541" fill="#000" font-size="13" textLength="433.551">FINDER_SCORING_ENABLED=false -> CvScorer fallback score 70; the</text><text x="1720" y="204.852" fill="#000" font-size="13" textLength="439.423">score >= 60 CV filter stops rejecting and APPLY_MODE stays shadow.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk12" data-link-type="dependency"><polygon points="1317.56,368.344,1311.422,360.642,1313.124,366.037,1307.73,367.739,1317.56,368.344" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1259.894,313.556 C1267.29,325.678 1277.723,340.278 1290,350.488 C1298.229,357.332 1303.388,360.972 1313.124,366.037" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1292" y="346.057" fill="#000" font-size="13" textLength="176.052">POST /v1/chat/completions</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0010" id="lnk13" data-link-type="dependency"><polygon points="2692.819,470.037,2684.085,465.485,2687.829,469.726,2683.587,473.469,2692.819,470.037" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1706.641,411.367 C1971.106,426.609 2351.387,448.841 2684,469.488 C2686.926,469.67 2684.876,469.542 2687.829,469.726" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="2363" y="447.057" fill="#000" font-size="13" textLength="56.685">local slot</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk14" data-link-type="dependency"><polygon points="316.357,470.438,325.746,473.411,321.325,469.881,324.855,465.461,316.357,470.438" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1045.306,410.916 C838.067,423.9 565.567,443.589 325,469.488 C322.144,469.796 324.229,469.556 321.325,469.881" style="stroke:#181818;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk15" data-link-type="dependency"><polygon points="608.139,470.626,617.581,473.426,613.097,469.978,616.545,465.494,608.139,470.626" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterli