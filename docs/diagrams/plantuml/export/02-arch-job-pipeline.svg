<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2754px;height:834px;background:#FFFFFF;" width="2754px" height="834px" viewBox="0 0 2754 834" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="1144.616" y="23.535" fill="#000" font-size="14" textLength="457.769" font-weight="700">02 - job pipeline: sources, finder, kafka, worker fleet, db and ui</text></g><!--entity n0--><g class="entity" data-qualified-name="n0" id="ent0001" data-source-line="4"><rect x="1300.5" y="107.988" width="573.716" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1854.216" y="112.988" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1852.216" y="114.988" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1852.216" y="118.988" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1315.5" y="141.523" fill="#000" font-size="14" textLength="533.716">External sources - NoFluffJobs, JustJoin.it, theProtocol.it (PL only, fully remote)</text></g><!--entity n1--><g class="entity" data-qualified-name="n1" id="ent0002" data-source-line="5"><rect x="1257.5" y="267.488" width="659.514" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1897.014" y="272.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1895.014" y="274.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1895.014" y="278.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1272.5" y="301.023" fill="#000" font-size="14" textLength="619.514">finder = Discovery &amp; Deduplication Agent - crawl/API, normalize, hash + similarity dedupe</text></g><!--entity n2--><g class="entity" data-qualified-name="n2" id="ent0003" data-source-line="6"><rect x="1239" y="368.488" width="697.398" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1916.398" y="373.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1914.398" y="375.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1914.398" y="379.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1254" y="402.023" fill="#000" font-size="14" textLength="657.398">campaign.jobs - Kafka topic, reference name validated_job_offers, 3 partitions, key companyKey</text></g><!--entity n3--><g class="entity" data-qualified-name="n3" id="ent0004" data-source-line="7"><rect x="1227.5" y="469.488" width="720.395" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1927.895" y="474.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1925.895" y="476.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1925.895" y="480.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1242.5" y="503.023" fill="#000" font-size="14" textLength="680.395">apply-worker pool - consumer group apply-workers, one record per poll, ack after the Mongo write</text></g><!--entity n4--><g class="entity" data-qualified-name="n4" id="ent0005" data-source-line="8"><rect x="6" y="570.488" width="612.756" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="598.756" y="575.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="596.756" y="577.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="596.756" y="581.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="21" y="604.023" fill="#000" font-size="14" textLength="572.756">worker specialisms (reference) - skill/stack, salary/benefit, company/culture checks</text></g><!--entity n5--><g class="entity" data-qualified-name="n5" id="ent0006" data-source-line="9"><rect x="637" y="570.488" width="613.323" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1230.323" y="575.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1228.323" y="577.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1228.323" y="581.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="652" y="604.023" fill="#000" font-size="14" textLength="573.323">campaign.jobs.dlq - poison messages past maxAttempts -> job_state.status=DEAD</text></g><!--entity n6--><g class="entity" data-qualified-name="n6" id="ent0007" data-source-line="10"><rect x="1268.5" y="570.488" width="638.015" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1886.515" y="575.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1884.515" y="577.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1884.515" y="581.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1283.5" y="604.023" fill="#000" font-size="14" textLength="598.015">mongo-0 = Job Search DB - job_listings, applications, skips, blockers, events, job_state</text></g><!--entity n7--><g class="entity" data-qualified-name="n7" id="ent0008" data-source-line="11"><rect x="1852" y="671.488" width="508.761" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="2340.761" y="676.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2338.761" y="678.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2338.761" y="682.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1867" y="705.023" fill="#000" font-size="14" textLength="468.761">campaign-api = UI/API - NodePort 30080, /stats /jobs /applications</text></g><!--entity n8--><g class="entity" data-qualified-name="n8" id="ent0009" data-source-line="12"><rect x="1924.5" y="570.488" width="609.625" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="2514.125" y="575.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2512.125" y="577.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2512.125" y="581.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1939.5" y="604.023" fill="#000" font-size="14" textLength="569.625">Chrome in lubuntu-agent - CDP node IP :30922, used only when APPLY_MODE=live</text></g><!--entity n9--><g class="entity" data-qualified-name="n9" id="ent0010" data-source-line="13"><rect x="2111" y="772.488" width="626.961" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="2717.961" y="777.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2715.961" y="779.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2715.961" y="783.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="2126" y="806.023" fill="#000" font-size="14" textLength="586.961">mode switch - APPLY_MODE=shadow, msrouter PAUSED (replicas 0), fallback score 70</text></g><g class="entity" data-qualified-name="guide" id="ent0021" data-source-line="25"><path d="M1893,49.488 L1893,212.594 L2388.189,212.594 L2388.189,59.488 L2378.189,49.488 L1893,49.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2378.189,49.488 L2378.189,59.488 L2388.189,59.488 L2378.189,49.488" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1899" y="67.057" fill="#000" font-size="13" textLength="171.818">Reference flow vs deployed</text><text x="1899" y="82.367" fill="#000" font-size="13" textLength="429.324">Reference: External sources -> Discovery &amp; Deduplication Agent -></text><text x="1899" y="97.678" fill="#000" font-size="13" textLength="435.595">Kafka (validated_job_offers) -> worker agents -> Job Search DB / UI.</text><text x="1899" y="112.988" fill="#000" font-size="13" textLength="474.189">Deployed: finder -> campaign.jobs -> apply-worker pool -> mongo-0 -></text><text x="1899" y="128.299" fill="#000" font-size="13" textLength="382.25">campaign-api, with campaign.jobs.dlq for poison messages.</text><text x="1899" y="143.609" fill="#000" font-size="13" textLength="452.531">The reference names three specialist workers; the deployment runs one</text><text x="1899" y="158.92" fill="#000" font-size="13" textLength="444.253">consumer group (apply-workers), so parallelism comes from the three</text><text x="1899" y="174.23" fill="#000" font-size="13" textLength="219.356">partitions, not from three services.</text><text x="1899" y="189.541" fill="#000" font-size="13" textLength="457.393">Kafka owns delivery, Mongo owns bookkeeping: the offset commits only</text><text x="1899" y="204.852" fill="#000" font-size="13" textLength="433.177">after the Mongo write succeeds, and a redelivery declines the action.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="1587.5,267.37,1591.5,258.37,1587.5,262.37,1583.5,258.37,1587.5,267.37" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1587.5,154.22 C1587.5,184.238 1587.5,232.41 1587.5,262.37" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1589.5" y="245.057" fill="#000" font-size="13" textLength="40.923">collect</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk12" data-link-type="dependency"><polygon points="1587.5,368.454,1591.5,359.454,1587.5,363.454,1583.5,359.454,1587.5,368.454" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1587.5,313.953 C1587.5,330.269 1587.5,347.238 1587.5,363.454" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1589.5" y="346.057" fill="#000" font-size="13" textLength="153.67">produce validated offers</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk13" data-link-type="dependency"><polygon points="1587.5,469.454,1591.5,460.454,1587.5,464.454,1583.5,460.454,1587.5,469.454" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1587.5,414.953 C1587.5,431.269 1587.5,448.238 1587.5,464.454" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1589.5" y="447.057" fill="#000" font-size="13" textLength="56.786">consume</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk14" data-link-type="dependency"><polygon points="595.875,570.485,605.157,573.776,600.86,570.098,604.538,565.8,595.875,570.485" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1304.14,515.49 C1093.289,531.862 811.715,553.726 600.86,570.098" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1066.5" y="548.057" fill="#000" font-size="13" textLength="103.987">the three checks</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk15" data-link-type="dependency"><polygon points="1086.683,570.477,1096.186,573.063,1091.625,569.717,1094.971,565.156,1086.683,570.477" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1444.176,515.521 C1337.711,531.888 1198.056,553.356 1091.625,569.717" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1325.5" y="548.057" fill="#000" font-size="13" textLength="85.033">maxAttempts</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk16" data-link-type="dependency"><polygon points="1587.5,570.454,1591.5,561.454,1587.5,565.454,1583.5,561.454,1587.5,570.454" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1587.5,515.953 C1587.5,532.269 1587.5,549.238 1587.5,565.454" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1589.5" y="548.057" fill="#000" font-size="13" textLength="238.208">record submitted / skipped / blocked</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" id="lnk17" data-link-type="dependency"><polygon points="2086.762,570.477,2078.476,565.152,2081.82,569.715,2077.257,573.059,2086.762,570.477" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1730.379,515.521 C1836.513,531.888 1975.719,553.354 2081.82,569.715" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1968.5" y="548.057" fill="#000" font-size="13" textLength="98.865">apply (live only)</text></g><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk18" data-link-type="dependency"><polygon points="1990.885,671.434,1982.793,665.819,1985.973,670.498,1981.295,673.677,1990.885,671.434" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1703.005,616.521 C1788.731,632.873 1900.222,654.14 1985.973,670.498" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1895.5" y="649.057" fill="#000" font-size="13" textLength="27.923">read</text></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" id="lnk19" data-link-type="dependency"><polygon points="2353.74