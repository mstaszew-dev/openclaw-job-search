<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:2564px;height:516px;background:#FFFFFF;" width="2564px" height="516px" viewBox="0 0 2564 516" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="1063.513" y="23.535" fill="#000" font-size="14" textLength="429.974" font-weight="700">05 - whatsapp mcp: opencode only, not part of the pipeline</text></g><!--entity n0--><g class="entity" data-qualified-name="n0" id="ent0001" data-source-line="4"><rect x="1114.5" y="100.488" width="554.172" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1648.672" y="105.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1646.672" y="107.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1646.672" y="111.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1129.5" y="134.023" fill="#000" font-size="14" textLength="514.172">opencode (Mac) - MCP stdio client, mcp.servers.whatsapp in opencode.json</text></g><!--entity n1--><g class="entity" data-qualified-name="n1" id="ent0002" data-source-line="5"><rect x="219.5" y="252.488" width="530.349" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="729.849" y="257.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="727.849" y="259.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="727.849" y="263.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="234.5" y="286.023" fill="#000" font-size="14" textLength="490.349">whatsapp-mcp-server - Python, uv run main.py in tools/whatsapp-mcp</text></g><!--entity n2--><g class="entity" data-qualified-name="n2" id="ent0003" data-source-line="6"><rect x="211" y="353.488" width="547.083" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="738.083" y="358.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="736.083" y="360.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="736.083" y="364.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="226" y="387.023" fill="#000" font-size="14" textLength="507.083">whatsapp-bridge - Go / whatsmeow, WhatsApp Web multi-device, QR link</text></g><!--entity n3--><g class="entity" data-qualified-name="n3" id="ent0004" data-source-line="7"><rect x="6" y="454.488" width="448.919" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="434.919" y="459.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="432.919" y="461.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="432.919" y="465.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="21" y="488.023" fill="#000" font-size="14" textLength="408.919">SQLite store/messages.db - local history, chats + messages</text></g><!--entity n4--><g class="entity" data-qualified-name="n4" id="ent0005" data-source-line="8"><rect x="473" y="454.488" width="533.11" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="986.11" y="459.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="984.11" y="461.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="984.11" y="465.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="488" y="488.023" fill="#000" font-size="14" textLength="493.11">personal WhatsApp account - paired device, the user controls the phone</text></g><!--entity n5--><g class="entity" data-qualified-name="n5" id="ent0006" data-source-line="9"><rect x="767.5" y="252.488" width="629.675" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1377.175" y="257.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1375.175" y="259.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1375.175" y="263.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="782.5" y="286.023" fill="#000" font-size="14" textLength="589.675">MCP tools - search_contacts, list_messages, list_chats, get_chat, get_message_context</text></g><!--entity n6--><g class="entity" data-qualified-name="n6" id="ent0007" data-source-line="10"><rect x="1416" y="252.488" width="568.644" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="1964.644" y="257.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1962.644" y="259.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="1962.644" y="263.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="1431" y="286.023" fill="#000" font-size="14" textLength="528.644">MCP tools - send_message, send_file, send_audio_message, download_media</text></g><!--entity n7--><g class="entity" data-qualified-name="n7" id="ent0008" data-source-line="11"><rect x="2003" y="252.488" width="544.533" height="46.488" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><rect x="2527.533" y="257.488" width="15" height="10" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2525.533" y="259.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><rect x="2525.533" y="263.488" width="4" height="2" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="2018" y="286.023" fill="#000" font-size="14" textLength="504.533">scope note - opencode only, NOT wired into the campaign pipeline or k3s</text></g><g class="entity" data-qualified-name="guide" id="ent0016" data-source-line="20"><path d="M1686.5,49.488 L1686.5,197.283 L2138.512,197.283 L2138.512,59.488 L2128.512,49.488 L1686.5,49.488" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M2128.512,49.488 L2128.512,59.488 L2138.512,59.488 L2128.512,49.488" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="1692.5" y="67.057" fill="#000" font-size="13" textLength="424.227">opencode only: nothing in the campaign pipeline or the k3s cluster</text><text x="1692.5" y="82.367" fill="#000" font-size="13" textLength="105.581">calls these tools.</text><text x="1692.5" y="97.678" fill="#000" font-size="13" textLength="375.242">Install: brew install go, clone lharries/whatsapp-mcp under</text><text x="1692.5" y="112.988" fill="#000" font-size="13" textLength="294.36">/ZCodeProject/tools, then go build the bridge.</text><text x="1692.5" y="128.299" fill="#000" font-size="13" textLength="431.012">The bridge keeps WhatsApp Web multi-device state in a local SQLite</text><text x="1692.5" y="143.609" fill="#000" font-size="13" textLength="218.042">store and prints a QR code to pair.</text><text x="1692.5" y="158.92" fill="#000" font-size="13" textLength="408.821">Pairing needs the user's phone (WhatsApp > Linked devices); the</text><text x="1692.5" y="174.23" fill="#000" font-size="13" textLength="207.854">re-link window is about 20 days.</text><text x="1692.5" y="189.541" fill="#000" font-size="13" textLength="426.645">No message is sent by setup; sends happen only on an explicit ask.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="617.557,252.483,627.089,254.961,622.49,251.667,625.784,247.068,617.557,252.483" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1258.156,146.541 C1086.306,174.961 794.202,223.27 622.49,251.667" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="832.5" y="230.057" fill="#000" font-size="13" textLength="62.905">MCP stdio</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="484.5,353.454,488.5,344.454,484.5,348.454,480.5,344.454,484.5,353.454" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M484.5,298.953 C484.5,315.269 484.5,332.238 484.5,348.454" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="486.5" y="331.057" fill="#000" font-size="13" textLength="135.522">HTTP queries / sends</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="287.013,454.462,296.851,454.92,291.672,452.646,293.946,447.466,287.013,454.462" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M427.814,399.583 C385.851,415.938 333.593,436.306 291.672,452.646" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="382.5" y="432.057" fill="#000" font-size="13" textLength="42.618">persist</text></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk12" data-link-type="dependency"><polygon points="682.764,454.462,675.822,447.475,678.103,452.652,672.927,454.933,682.764,454.462" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M541.41,399.583 C583.537,415.938 636.017,436.313 678.103,452.652" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="637.5" y="432.057" fill="#000" font-size="13" textLength="136.767">multi-device protocol</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk13" data-link-type="dependency"><polygon points="1128.029,252.387,1137.872,252.055,1132.527,250.203,1134.379,244.858,1128.029,252.387" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1345.906,146.621 C1287.401,175.022 1191.001,221.818 1132.527,250.203" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1202.5" y="230.057" fill="#000" font-size="13" textLength="57.04">tools/list</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk14" data-link-type="dependency"><polygon points="1654.971,252.387,1648.621,244.858,1650.473,250.203,1645.128,252.055,1654.971,252.387" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1437.094,146.621 C1495.599,175.022 1591.999,221.818 1650.473,250.203" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="1620.5" y="230.057" fill="#000" font-size="13" textLength="59.389">tools/call</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0008" id="lnk15" data-link-type="dependency"><polygon points="2054.023,252.484,2045.534,247.491,2049.055,251.918,2044.628,255.44,2054.023,252.484" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M1467.408,146.555 C1524.72,162.557 1605.525,183.722 1677.5,197.488 C1801.261,221.16 1935.885,239.029 2049.055,251.918" style="stroke:#181818;stroke-width:1;" fill="none"/></g><?plantuml-src TLFBRjim4BphAnQvD47bH_Cgu001YXpQ0adgj0O2z19GrCPYJ94gISNnfT_U8MahRj5SR76vExkSdGagQARf6OretOZWHTTHAxiPsOwDj3MJDNfJah61Ek42sKSA3LEdEjRASE5Nok12jEGRKTkrCajw5DfpqIXKSzk53RNSLkny8MtRMSCcqC60VtWZv17QtrpDoOTQMP9Q8QMCSumzksTKZeVXb1b66pzvQmv8U3BJVUXTxWW0emm0_FacDDQKr3-JwmsrGfbnjubumLhj9_jL6VJ3Vq4hf-eb0_2pfKachMMxBka-Vdx2YFTSKTlhe4OrFol99Trz9v2roh37-x0_xgvLO3pSEfwqxBrOiX_N5V2rbK9Je-8TDY0ZFBsdNL86Eza7wy2KDIWQHX5IsXvN8onFEQvfDr7SOGzkI5eJ7DwVjmg6E0EVxWF7tIIM0EHPEDayn3eXWo_nCXyUTbDjZsdOafQSF_FND