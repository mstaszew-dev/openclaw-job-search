                        - text: "מיקום: תל אביב - יפוהיקף: משרה מלאהמודל עבודה: היברידיעל התפקידלחברת תקשורת מובילה דרוש/ה Tech Lead בכיר/ה עם אוריינטציית Full-Stack להצטרפות לצוות טכנולוגי קטן, עצמאי ואיכותי, ולהובלת פיתוח של מערכות ליבה, תשתיות ושירותים חדשים - משלב האפיון ועד לפרודקשן.התפקיד הוא Hands-on וכולל אחריות משמעותית על החלטות ארכיטקטורה, איכות קוד, ביצועים וסקייל, ועבודה על מערכות תוכן ומדיה בקנה מידה גבוה.זו הזדמנות להשפיע באמת על מוצרים וטכנולוגיה, בסביבה שמעריכה עצמאות, חשיבה מערכתית וסטנדרטים גבוהים.תחומי אחריות:הובלה טכנולוגית Hands-on של צוות פיתוח קטן.פיתוח והובלה של מערכות Full-Stack מורכבות מקצה לקצה.תכנון ויישום ארכיטקטורת Frontend ו-Backend.פיתוח שירותים ומוצרים חדשים לצד תחזוקה ושיפור מערכות קיימות.קבלת החלטות טכנולוגיות והכוונת מפתחים נוספים.עבודה שוטפת מול צוותי מוצר, תוכן ו-DevOps.שיפור ביצועים, יציבות ואמינות מערכות בפרודקשן."
                        - generic [ref=e229]: "דרישות: לפחות 5 שנות ניסיון בפיתוח Full-Stack.לפחות שנתיים ניסיון בהובלה טכנולוגית / הובלת צוות.ניסיון משמעותי ב-JavaScript / TypeScript.ניסיון חזק בפיתוח Frontend עם React.ניסיון בפיתוח אפליקציות עם Next.js.ניסיון בפיתוח Backend עם Node.js / NestJS.ניסיון בעבודה עם בסיסי נתונים: PostgreSQL / MongoDB / Redis.הבנה עמוקה של ארכיטקטורת Web, APIs, REST, ביצועים ואבטחה.ניסיון בעבודה עם מערכות בפרודקשן בקנה מידה גבוה.יתרון משמעותי:ניסיון בפיתוח ב-Golang.ניסיון בפיתוח Microservices.ניסיון בעבודה בסביבות Cloud.ניסיון במנטורינג, Code Reviews והטמעת Best Practices.מה אנחנו מציעים:תפקיד עם השפעה טכנולוגית אמיתית.צוות קטן ואיכותי עם עצמאות ואחריות גבוהה.עבודה על מערכות מורכבות ומאתגרות טכנולוגית.סביבת עבודה שמעריכה איכות, יוזמה ולמידה.תנאים טובים למתאימים.* המשרה מיועדת לנשים ולגברים כאחד."
