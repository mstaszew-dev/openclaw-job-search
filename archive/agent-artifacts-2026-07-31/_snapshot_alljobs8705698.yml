                    - text: We are looking for a highly experienced Java Developer to design and develop the core backend software layer over the company's specialized flagship product.You'll build systems that handle bursty, high-throughput workloads - think thousands of requests per second with strict latency requirements. This means making real trade-offs around concurrency models, resource pooling, and distributed coordination.It is a unique opportunity to join a team of top-notch engineers and work on cutting-edge technologies in a fast-paced environment of quantum computation.What Makes This Role Different:Our backend team sits in the middle of everything - we're the orchestration layer between:Hardware control systems (C++)Client exposed SDK (Python)Reporting and managing system (Go)Our business logic (Java/Kotlin + Spring).
