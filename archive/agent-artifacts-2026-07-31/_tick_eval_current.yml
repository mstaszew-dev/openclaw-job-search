                          - generic [ref=e355]: "דרישות: - ניסיון קודם בתפקיד דומה - חובה.- שליטה מלאה בתוכנות Office.- ניסיון בעבודה מול לקוחות ותודעת שירות גבוהה.- יכולת עבודה בסביבה ממוחשבת.שליחת קורות חיים או הגשת מועמדות מהווה הסכמה לכך שחברת גוב ספייס בעמ (החברה) תשמור ותשתמש בפרטיך, לרבות למטרת פנייה אליך בנוגע למשרות נוספות ודומות, בכל עת, ובנוסף גם להעברת פרטיך למעסיקים פוטנציאליים בעתיד. השימוש במידע ייעשה בהתאם למדינות הפרטיות באתר החברה ובה גם מידע על זכויותיך. ניתן לסרב לשימוש עתידי כאמור במידע בשליחת תמחקו אותי או לפנות בכל שאלה או בקשה בנושא באמצעות פרטי הקשר שבמדיניות הפרטיות. המשרה מיועדת לנשים ולגברים כאחד."
