                      - generic [ref=e619]:
                        - generic [ref=e621]:
                          - text: "מרכז רפואי אינטגרטיבי פרטי במתחם ויצמן תל אביב, ?המתמחה בטיפול במחלות מטבוליות ובעיות מורכבות במערכת העיכול, בשילוב ייחודי של רפואה קונבנציונלית מתקדמת וליווי מעולם הרפואה האלטרנטיבית - מגייס מנהל /ת משאבי אנוש לחצי משרה בשכר גבוה. מקום עבודה חם ומשפחתי, שבו המקצועיות פוגשת עבודה עם אנשים!תיאור התפקיד:- אחריות מקצה לקצה על ניהול תחום משאבי האנוש בארגון.- הכנה והגשת נתונים למשרד רו\"ח חיצוני, תוך הפגנת ידע מקצועי בדיני עבודה וחשבות שכר.- מתן מענה מהיר ומקצועי להנהלה ולעובדים בסוגיות אדמיניסטרטיביות ומקצועיות.שכר ותנאים:- שכר גבוה.- חצי משרה נוחה: 5 ימים בשבוע, כ-4-5 שעות ביום - אידיאלי לאיזון בית-עבודה.- מודל העסקה גמיש: שכיר/ה או כנגד חשבונית.- סביבת עבודה חמה ומשפחתית במרכז רפואי מוביל בלב תל אביב.- מיקום: מתחם ויצמן, תל אביב"
                          - generic [ref=e622]: "דרישות: - ניסיון מוכח בתפקיד דומה בתחום משאבי אנוש - חובה.- שליטה מלאה בעברית.- שליטה מעולה בסביבה ממוחשבת, כולל עבודה עם דוחות ומערכות ברמה גבוהה.- רוסית - יתרון משמעותי.- תעודת חשב/ת שכר וידע מעמיק בדיני עבודה - יתרון משמעותי.שליחת קורות חיים או הגשת מועמדות מהווה הסכמה לכך שחברת גוב ספייס בעמ (החברה) תשמור ותשתמש בפרטיך, לרבות למטרת פנייה אליך בנוגע למשרות נוספות ודומות, בכל עת, ובנוסף גם להעברת פרטיך למעסיקים פוטנציאליים בעתיד. השימוש במידע ייעשה בהתאם למדינות הפרטיות באתר החברה ובה גם מידע על זכויותיך. ניתן לסרב לשימוש עתידי כאמור במידע בשליחת תמחקו אותי או לפנות בכל שאלה או בקשה בנושא באמצעות פרטי הקשר שבמדיניות הפרטיות. המשרה מיועדת לנשים ולגברים כאחד."
