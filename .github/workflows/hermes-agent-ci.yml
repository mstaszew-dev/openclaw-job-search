name: hermes-agent-ci

on:
  push:
    paths: ["hermes_agent/**", ".github/workflows/hermes-agent-ci.yml"]
  pull_request:
    paths: ["hermes_agent/**", ".github/workflows/hermes-agent-ci.yml"]

defaults:
  run:
    working-directory: hermes_agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Typecheck
        run: mypy
      - name: Test (coverage gate 98, line+branch)
        run: python -m pytest
