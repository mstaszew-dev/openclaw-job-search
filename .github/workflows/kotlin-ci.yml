name: kotlin-ci

on:
  push:
    branches: ['**']
    paths:
      - 'kotlin/**'
      # deploy/ carries the manifests and scripts that decide what actually
      # runs in the cluster; a change there that never reaches CI is exactly
      # the class of bug this pipeline exists to catch.
      - 'deploy/**'
      - '.github/workflows/kotlin-ci.yml'
  pull_request:
    paths:
      - 'kotlin/**'
      - 'deploy/**'
      - '.github/workflows/kotlin-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Docker is available here, so the Testcontainers integration tests
      # (claim/reaper/dedup/JSONB) actually run, unlike on the dev Mac.
      - name: Build and test
        run: ./gradlew build
