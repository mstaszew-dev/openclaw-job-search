name: campaign-agent-ci

on:
  push:
    paths:
      - campaign_agent/**
      - .github/workflows/campaign-agent-ci.yml
  pull_request:
    paths:
      - campaign_agent/**
      - .github/workflows/campaign-agent-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r campaign_agent/requirements.txt
      - name: Test (98% coverage gate; machine-local policy tests self-skip)
        run: cd campaign_agent && pytest -q
