name: campaign-agent-ci

on:
  push:
    paths:
      - campaign_agent/**
      - campaign-agent
      - tests/**
      - .github/workflows/campaign-agent-ci.yml
  pull_request:
    paths:
      - campaign_agent/**
      - campaign-agent
      - tests/**
      - .github/workflows/campaign-agent-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The launcher resolves its own dir via system python3 (preinstalled on
      # ubuntu runners), so this step is independent of setup-python below.
      - name: Shell launcher tests (bats)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bats zsh
          bats tests/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r campaign_agent/requirements.txt
      - name: Test (98% coverage gate; machine-local policy tests self-skip)
        run: cd campaign_agent && pytest -q
